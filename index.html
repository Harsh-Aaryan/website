<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harsh Aaryan - CS Portfolio</title>
  <meta name="description" content="Harsh Aaryan — Computer Science student and software engineer. Portfolio, projects, resume, and contact.">
  <meta name="theme-color" content="#0E0A05">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=VT323&display=swap" rel="stylesheet">
  <style>
    html, body, #root { margin: 0; height: 100%; background: #07090C; color: #FFB000; }
    .boot-loader {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: VT323, monospace;
      letter-spacing: 0.08em;
      gap: 16px;
    }
    .boot-loader-bar {
      width: min(280px, 70vw);
      height: 10px;
      border: 1px solid #FFB000;
      padding: 2px;
    }
    .boot-loader-bar > i {
      display: block;
      height: 100%;
      width: 28%;
      background: #FFB000;
      animation: load 1.2s steps(8, end) infinite;
    }
    @keyframes load {
      0% { width: 8%; }
      100% { width: 92%; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot-loader" aria-live="polite">
      <div>BOOTING HARSH.OS...</div>
      <div class="boot-loader-bar"><i></i></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
