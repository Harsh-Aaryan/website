<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harsh Aaryan - CS Portfolio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Harsh Aaryan — Computer Science student and software engineer. Portfolio, projects, resume, and contact.">
  <meta name="theme-color" content="#0E0A05">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=VT323&display=swap" rel="stylesheet">
  <style>
    html, body, #root {
      margin: 0;
      height: 100%;
      color: #FFB000;
      background:
        radial-gradient(ellipse 26% 44% at 7% 38%, rgba(143, 180, 201, 0.2), transparent 60%),
        radial-gradient(ellipse 46% 36% at 72% 78%, rgba(255, 176, 0, 0.05), transparent 58%),
        linear-gradient(180deg, #0b0d12 0%, #07090c 46%, #101318 100%);
    }
    .boot-loader {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: VT323, monospace;
      letter-spacing: 0.08em;
      gap: 16px;
    }
    .boot-loader::before {
      content: '';
      position: absolute;
      left: 0;
      top: 22%;
      width: 16%;
      height: 36%;
      background: linear-gradient(90deg, rgba(143, 180, 201, 0.16), transparent);
      pointer-events: none;
    }
    .boot-loader-bar {
      width: min(280px, 70vw);
      height: 10px;
      border: 1px solid #FFB000;
      padding: 2px;
    }
    .boot-loader-bar > i {
      display: block;
      height: 100%;
      width: 28%;
      background: #FFB000;
      animation: load 1.2s steps(8, end) infinite;
    }
    @keyframes load {
      0% { width: 8%; }
      100% { width: 92%; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot-loader" aria-live="polite">
      <div>BOOTING HARSH.OS...</div>
      <div class="boot-loader-bar"><i></i></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
